<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Mi Armario IA</title>
    
    <!-- MediaPipe Selfie Segmentation -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --danger: #ef4444;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header-editable {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
            border: none;
            background: transparent;
            outline: none;
            cursor: pointer;
            width: 100%;
        }
        .container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        h2 { margin-top: 0; color: #fff; font-size: 1.4rem; }
        p { color: var(--text-muted); font-size: 13px; }
        .hidden { display: none !important; }
        input[type="file"] { display: none; }
        
        input[type="email"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: white;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .custom-file-upload {
            border: 2px dashed var(--primary);
            display: block;
            padding: 12px;
            cursor: pointer;
            border-radius: 10px;
            background-color: rgba(99, 102, 241, 0.08);
            color: var(--text-color);
            font-weight: 600;
            margin: 12px 0;
            transition: background 0.3s;
            font-size: 14px;
        }
        .custom-file-upload:hover { background-color: rgba(99, 102, 241, 0.2); }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            margin-top: 8px;
            transition: transform 0.1s ease, background 0.3s;
        }
        button:active { transform: scale(0.96); }
        button:hover { background-color: var(--primary-hover); }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.05); color: white; }

        .preview-box {
            width: 140px;
            height: 180px;
            margin: 12px auto;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Pantalla de Carga Global Full Screen */
        #globalLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 15px;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .spinner-grande {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Botón Flotante para Añadir Prenda (+) */
        .header-armario-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .btn-fab-agregar {
            background: var(--primary);
            color: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
            margin-top: 0;
            width: auto;
            padding: 0 12px;
            gap: 5px;
        }
        .btn-fab-agregar:hover { background: var(--primary-hover); transform: scale(1.05); }

        /* Panel Desplegable para Agregar Prenda */
        #panelAgregarPrenda {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: left;
            position: relative;
        }
        .btn-cerrar-panel {
            position: absolute;
            top: 10px;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
        }
        .btn-cerrar-panel:hover { color: white; }

        .grid-prendas {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 4px;
        }
        .card-prenda {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .card-prenda.no-disponible {
            opacity: 0.5;
            filter: grayscale(40%);
        }
        .card-prenda img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: white;
            border-radius: 6px;
            margin-bottom: 5px;
        }
        .badge-estado {
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .badge-disponible { background: rgba(34, 197, 94, 0.2); color: var(--accent); }
        .badge-lavanderia { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .nav-tabs button {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- LOADER GLOBAL FULL SCREEN -->
    <div id="globalLoader" class="hidden">
        <div class="spinner-grande"></div>
        <span id="txtGlobalLoader">Cargando...</span>
    </div>

    <input type="text" id="inputTituloApp" class="header-editable" value="✨ Mi Armario IA ✨" oninput="cambiarTituloApp()">

    <!-- SECCIÓN 1: LOGIN / REGISTRO -->
    <div class="container" id="seccionAuth">
        <h2>Bienvenido</h2>
        <p>Inicia sesión o regístrate para acceder a tu armario</p>
        
        <input type="email" id="authCorreo" placeholder="Correo electrónico">
        <input type="password" id="authPassword" placeholder="Contraseña">

        <button onclick="ejecutarAuth('login')">Iniciar Sesión</button>
        <button class="btn-secondary" onclick="mostrarRegistroCuerpo()">Registrarse con Foto Base</button>
    </div>

    <!-- SECCIÓN 2: REGISTRO DE FOTO CORPORAL (MANIQUÍ) -->
    <div class="container hidden" id="seccionRegistroCuerpo">
        <h2>Foto Base (Maniquí)</h2>
        <p>Tómate una foto de cuerpo completo. La IA limpiará el fondo.</p>

        <div class="preview-box hidden" id="marcoRegistro">
            <img id="imgRegistroPreview" alt="Cuerpo base">
        </div>

        <label class="custom-file-upload">
            <input type="file" accept="image/*" onchange="procesarFotoConIA(event, 'registroCuerpo')">
            📷 Capturar / Subir Foto Base
        </label>

        <button id="btnFinalizarRegistro" class="hidden" onclick="completarRegistroUsuario()">Crear Cuenta</button>
        <button class="btn-secondary" onclick="volverLogin()">Volver</button>
    </div>

    <!-- SECCIÓN 3: PANEL PRINCIPAL (ARMARIO Y OUTFITS) -->
    <div class="container hidden" id="seccionPrincipal">
        <div class="nav-tabs">
            <button onclick="cambiarTab('armario')">👕 Armario</button>
            <button class="btn-secondary" onclick="cambiarTab('outfit')">✨ Crear Outfit</button>
        </div>

        <!-- Sub-pestaña Armario -->
        <div id="tabArmario">
            <div class="header-armario-flex">
                <span id="saludoUsuario" style="font-weight: bold; font-size: 14px; color: var(--text-muted);">Mis Prendas</span>
                <button class="btn-fab-agregar" onclick="togglePanelAgregar(true)" title="Añadir Prenda">➕ Añadir</button>
            </div>

            <!-- Panel Desplegable para Añadir Prenda -->
            <div id="panelAgregarPrenda" class="hidden">
                <button class="btn-cerrar-panel" onclick="togglePanelAgregar(false)">✕</button>
                <p style="margin-top: 0; font-weight: bold; color: white;">Añadir Nueva Prenda</p>
                
                <select id="categoriaNuevaPrenda">
                    <option value="superior">Parte Superior (Polos, Camisas)</option>
                    <option value="inferior">Parte Inferior (Pantalones, Shorts)</option>
                    <option value="calzado">Calzado</option>
                    <option value="accesorios">Accesorios</option>
                </select>

                <div class="preview-box hidden" id="marcoPrendaPreview">
                    <img id="imgPrendaPreview" alt="Prenda recortada">
                </div>

                <label class="custom-file-upload">
                    <input type="file" accept="image/*" onchange="procesarFotoConIA(event, 'nuevaPrenda')">
                    📸 Seleccionar Prenda
                </label>

                <button id="btnGuardarPrendaCloud" class="hidden" onclick="guardarPrendaEnNube()">Guardar en el Armario</button>
            </div>

            <div class="grid-prendas" id="listaPrendasGrid"></div>
        </div>

        <!-- Sub-pestaña Outfit -->
        <div id="tabOutfit" class="hidden">
            <p>Selecciona la ocasión para hoy:</p>
            <select id="selectOcasion">
                <option value="casual">Salida Casual / Amigos</option>
                <option value="trabajo">Trabajo / Oficina</option>
                <option value="estudio">Estudio / Universidad</option>
                <option value="elegante">Elegante / Formal</option>
            </select>
            <button onclick="generarOutfitIA()">Generar Outfit Inteligente</button>
            
            <div id="resultadoOutfit" style="margin-top: 15px;"></div>
        </div>

        <button class="btn-secondary" style="margin-top: 25px;" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script>
        const URL_SCRIPT = "TU_URL_DE_APPS_SCRIPT_AQUI";

        let usuarioActual = null;
        let fotoCuerpoTemp = "";
        let imagenPrendaTemp = "";
        let listaMisPrendas = [];

        function cambiarTituloApp() {
            const nuevoTitulo = document.getElementById('inputTituloApp').value;
            document.getElementById('pageTitle').innerText = nuevoTitulo;
        }

        function mostrarLoader(texto) {
            document.getElementById('txtGlobalLoader').innerText = texto;
            document.getElementById('globalLoader').classList.remove('hidden');
        }

        function ocultarLoader() {
            document.getElementById('globalLoader').classList.add('hidden');
        }

        async function enviarDatosSheets(payload) {
            try {
                const respuesta = await fetch(URL_SCRIPT, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const texto = await respuesta.text();
                return JSON.parse(texto);
            } catch (error) {
                throw new Error("No se pudo conectar con el servidor.");
            }
        }

        async function procesarFotoConIA(event, tipoProceso) {
            const file = event.target.files[0];
            if (!file) return;

            const mensaje = tipoProceso === 'registroCuerpo' ? 'Procesando cuerpo con IA...' : 'Quitando fondo a la prenda...';
            mostrarLoader(mensaje);

            try {
                const selfieSegmentation = new SelfieSegmentation({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
                });
                selfieSegmentation.setOptions({ modelSelection: 1 });

                const img = new Image();
                const reader = new FileReader();
                reader.onload = (e) => { img.src = e.target.result; };

                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    selfieSegmentation.onResults((results) => {
                        ctx.save();
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
                        ctx.globalCompositeOperation = 'source-in';
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        ctx.restore();

                        const resultadoB64 = canvas.toDataURL('image/png');

                        if (tipoProceso === 'registroCuerpo') {
                            fotoCuerpoTemp = resultadoB64;
                            document.getElementById('imgRegistroPreview').src = fotoCuerpoTemp;
                            document.getElementById('marcoRegistro').classList.remove('hidden');
                            document.getElementById('btnFinalizarRegistro').classList.remove('hidden');
                        } else if (tipoProceso === 'nuevaPrenda') {
                            imagenPrendaTemp = resultadoB64;
                            document.getElementById('imgPrendaPreview').src = imagenPrendaTemp;
                            document.getElementById('marcoPrendaPreview').classList.remove('hidden');
                            document.getElementById('btnGuardarPrendaCloud').classList.remove('hidden');
                        }
                        occultarLoader();
                    });

                    await selfieSegmentation.send({ image: img });
                };
                reader.readAsDataURL(file);
            } catch (err) {
                occultarLoader();
                alert("Error al procesar la imagen con IA.");
            }
        }

        async function ejecutarAuth(accion) {
            const correo = document.getElementById('authCorreo').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (!correo || !password) {
                alert("Completa todos los campos.");
                return;
            }

            mostrarLoader("Iniciando sesión...");

            try {
                const res = await enviarDatosSheets({ accion: "login", correo, password });
                occultarLoader();

                if (res.status === "success") {
                    usuarioActual = correo;
                    document.getElementById('seccionAuth').classList.add('hidden');
                    document.getElementById('seccionPrincipal').classList.remove('hidden');
                    cargarPrendasArmario();
                } else {
                    alert(res.message);
                }
            } catch (e) {
                occultarLoader();
                alert(e.message);
            }
        }

        function mostrarRegistroCuerpo() {
            const correo = document.getElementById('authCorreo').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!correo || !password) {
                alert("Ingresa correo y contraseña primero.");
                return;
            }
            document.getElementById('seccionAuth').classList.add('hidden');
            document.getElementById('seccionRegistroCuerpo').classList.remove('hidden');
        }

        function volverLogin() {
            document.getElementById('seccionRegistroCuerpo').classList.add('hidden');
            document.getElementById('seccionAuth').classList.remove('hidden');
        }

        async function completarRegistroUsuario() {
            const correo = document.getElementById('authCorreo').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (!fotoCuerpoTemp) {
                alert("Falta capturar tu foto base.");
                return;
            }

            mostrarLoader("Registrando usuario...");

            try {
                const res = await enviarDatosSheets({
                    accion: "registro",
                    correo,
                    password,
                    fotoCuerpo: fotoCuerpoTemp
                });
                occultarLoader();

                if (res.status === "success") {
                    alert("¡Cuenta creada con éxito!");
                    usuarioActual = correo;
                    document.getElementById('seccionRegistroCuerpo').classList.add('hidden');
                    document.getElementById('seccionPrincipal').classList.remove('hidden');
                    cargarPrendasArmario();
                } else {
                    alert(res.message);
                }
            } catch (e) {
                occultarLoader();
                alert(e.message);
            }
        }

        function cerrarSesion() {
            usuarioActual = null;
            document.getElementById('seccionPrincipal').classList.add('hidden');
            document.getElementById('seccionAuth').classList.remove('hidden');
        }

        function togglePanelAgregar(mostrar) {
            const panel = document.getElementById('panelAgregarPrenda');
            if (mostrar) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
                imagenPrendaTemp = "";
                document.getElementById('marcoPrendaPreview').classList.add('hidden');
                document.getElementById('btnGuardarPrendaCloud').classList.add('hidden');
            }
        }

        async function guardarPrendaEnNube() {
            const categoria = document.getElementById('categoriaNuevaPrenda').value;
            if (!imagenPrendaTemp) return;

            mostrarLoader("Subiendo prenda al armario...");

            try {
                const img = new Image();
                img.src = imagenPrendaTemp;
                
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imagenComprimida = canvas.toDataURL('image/jpeg', 0.7);

                    const res = await enviarDatosSheets({
                        accion: "guardarPrenda",
                        correo: usuarioActual,
                        categoria,
                        urlImagen: imagenComprimida
                    });
                    
                    occultarLoader();

                    if (res.status === "success") {
                        alert("¡Prenda guardada en el armario!");
                        togglePanelAgregar(false);
                        cargarPrendasArmario();
                    } else {
                        alert(res.message);
                    }
                };
            } catch (e) {
                occultarLoader();
                alert("Error al comprimir o subir la prenda.");
            }
        }

        async function cargarPrendasArmario() {
            try {
                const res = await enviarDatosSheets({ accion: "obtenerPrendas", correo: usuarioActual });
                if (res.status === "success") {
                    listaMisPrendas = res.prendas;
                    renderizarGrillaPrendas();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderizarGrillaPrendas() {
            const grid = document.getElementById('listaPrendasGrid');
            grid.innerHTML = "";

            if (listaMisPrendas.length === 0) {
                grid.innerHTML = `<p style="grid-column: span 2; text-align: center; color: var(--text-muted);">Tu armario está vacío. ¡Añade prendas con el botón +!</p>`;
                return;
            }

            listaMisPrendas.forEach(p => {
                const estado = p.estado || 'disponible';
                const esNoDisponible = estado === 'lavanderia';
                
                grid.innerHTML += `
                    <div class="card-prenda ${esNoDisponible ? 'no-disponible' : ''}">
                        <img src="${p.urlImagen}" alt="Prenda">
                        ${esNoDisponible ? 
                            '<span class="badge-estado badge-lavanderia">No Disponible</span><button style="padding: 4px; font-size: 10px; background-color: var(--accent);" onclick="cambiarEstadoPrenda(\'' + p.idPrenda + '\', \'disponible\')">Marcar Disponible</button>' : 
                            '<span class="badge-estado badge-disponible">Disponible</span><button style="padding: 4px; font-size: 10px; background-color: var(--danger);" onclick="cambiarEstadoPrenda(\'' + p.idPrenda + '\', \'lavanderia\')">Lavandería</button>'
                        }
                    </div>
                `;
            });
        }

        async function cambiarEstadoPrenda(idPrenda, nuevoEstado) {
            mostrarLoader("Actualizando estado...");
            try {
                await enviarDatosSheets({ accion: "cambiarEstado", idPrenda, estado: nuevoEstado });
                await cargarPrendasArmario();
                occultarLoader();
            } catch (e) {
                occultarLoader();
                alert("No se pudo cambiar el estado.");
            }
        }

        function cambiarTab(tab) {
            const btnArmario = document.querySelector('.nav-tabs button:nth-child(1)');
            const btnOutfit = document.querySelector('.nav-tabs button:nth-child(2)');

            if (tab === 'armario') {
                document.getElementById('tabArmario').classList.remove('hidden');
                document.getElementById('tabOutfit').classList.add('hidden');
                btnArmario.className = '';
                btnOutfit.className = 'btn-secondary';
            } else {
                document.getElementById('tabArmario').classList.add('hidden');
                document.getElementById('tabOutfit').classList.remove('hidden');
                btnArmario.className = 'btn-secondary';
                btnOutfit.className = '';
            }
        }

        function generarOutfitIA() {
            const ocasion = document.getElementById('selectOcasion').value;
            const contenedor = document.getElementById('resultadoOutfit');
            
            // Filtrar solo las prendas disponibles (excluyendo lavandería)
            const disponibles = listaMisPrendas.filter(p => (!p.estado || p.estado === 'disponible'));

            if (disponibles.length === 0) {
                contenedor.innerHTML = `<p style="color: var(--danger);">No tienes prendas disponibles en este momento (todas están en lavandería).</p>`;
                return;
            }

            const prendaAleatoria = disponibles[Math.floor(Math.random() * disponibles.length)];
            
            contenedor.innerHTML = `
                <p style="color: var(--accent); font-weight: bold;">¡Outfit ideal para: ${ocasion}!</p>
                <div class="preview-box" style="margin: 0 auto;">
                    <img src="${prendaAleatoria.urlImagen}" alt="Outfit seleccionado">
                </div>
            `;
        }
    </script>
</body>
</html>
