<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Armario IA - Gestión de Outfit</title>
    <!-- Librería de IA para remover fondos automáticamente -->
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.umd.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #fff; }
        p { color: var(--text-muted); font-size: 14px; }
        .hidden { display: none !important; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            border: 2px dashed var(--primary);
            display: block;
            padding: 15px;
            cursor: pointer;
            border-radius: 10px;
            background-color: rgba(99, 102, 241, 0.08);
            color: var(--text-color);
            font-weight: 600;
            margin: 15px 0;
            transition: background 0.3s;
        }
        .custom-file-upload:hover {
            background-color: rgba(99, 102, 241, 0.2);
        }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background-color: var(--primary-hover); }
        
        .btn-success {
            background-color: var(--accent);
        }
        .btn-success:hover {
            background-color: #16a34a;
        }

        #previewCuerpo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin: 15px auto;
            border: 3px solid var(--primary);
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        .loader {
            margin: 15px 0;
            color: var(--text-muted);
            font-style: italic;
            font-weight: 500;
        }
        
        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            margin-bottom: 15px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- Panel de Perfil / Foto de Cuerpo -->
    <div class="container" id="seccionPerfil">
        <h2>Mi Armario IA</h2>
        <p>Configura tu foto de perfil con fondo transparente</p>

        <div id="loaderContainer" class="loader hidden">
            <span id="loaderText">Procesando imagen con IA...</span>
        </div>

        <img id="previewCuerpo" class="hidden" alt="Vista previa cuerpo">

        <label class="custom-file-upload">
            <input type="file" id="inputFotoCuerpo" accept="image/*" onchange="procesarFotoCuerpo(event)">
            📷 Seleccionar foto de perfil
        </label>

        <button id="btnRegistrar" class="hidden" onclick="ejecutarRegistro()">Guardar y Continuar</button>
    </div>

    <!-- Panel de Gestión de Prendas -->
    <div class="container hidden" id="seccionPrendas">
        <h2>Gestión de Prendas</h2>
        <p>Sube tus prendas y la IA limpiará el fondo automáticamente</p>

        <select id="categoriaPrenda">
            <option value="superior">Parte Superior (Polos, Camisas)</option>
            <option value="inferior">Parte Inferior (Pantalones, Shorts)</option>
            <option value="calzado">Calzado (Zapatillas, Zapatos)</option>
            <option value="accesorios">Accesorios</option>
        </select>

        <label class="custom-file-upload">
            <input type="file" id="inputPrenda" accept="image/*" onchange="subiryProcesarPrenda(event)">
            👕 Seleccionar foto de prenda
        </label>
    </div>

    <script>
        // URL de tu Web App de Google Apps Script (puedes reemplazarla si ya la tienes vinculada)
        const URL_SCRIPT = "TU_URL_DE_APPS_SCRIPT_AQUI";
        let fotocuerpoB64 = "";

        function mostrarLoader(mensaje) {
            document.getElementById('loaderText').innerText = mensaje;
            document.getElementById('loaderContainer').classList.remove('hidden');
        }

        function ocultarLoader() {
            document.getElementById('loaderContainer').classList.add('hidden');
        }

        // Función para procesar la foto de perfil o cuerpo completo
        async function procesarFotoCuerpo(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            mostrarLoader("La IA está limpiando el fondo de tu foto...");
            try {
                // Llamada corregida y compatible con la librería UMD
                const resultBlob = await imglyRemoveBackground(file);
                const reader = new FileReader();
                
                reader.onloadend = function() {
                    fotocuerpoB64 = reader.result;
                    const preview = document.getElementById('previewCuerpo');
                    preview.src = fotocuerpoB64;
                    preview.classList.remove('hidden');
                    document.getElementById('btnRegistrar').classList.remove('hidden');
                    ocultarLoader();
                }
                
                reader.readAsDataURL(resultBlob);
            } catch (err) {
                ocultarLoader();
                console.error(err);
                alert("Error al procesar la imagen: " + err);
            }
        }

        // Función para avanzar tras guardar el perfil
        function ejecutarRegistro() {
            if (!fotocuerpoB64) {
                alert("Primero debes subir y procesar tu foto.");
                return;
            }
            // Oculta perfil y muestra la sección de prendas de ropa
            document.getElementById('seccionPerfil').classList.add('hidden');
            document.getElementById('seccionPrendas').classList.remove('hidden');
        }

        // Función para procesar y subir prendas de ropa
        async function subirYProcesarPrenda(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const categoria = document.getElementById('categoriaPrenda').value;
            mostrarLoader("La IA está limpiando el fondo de tu prenda...");
            
            try {
                const blobLimpio = await imglyRemoveBackground(file);
                const reader = new FileReader();
                
                reader.onloadend = async function() {
                    const urlImagenLimpias = reader.result;
                    
                    // Envío opcional a Google Apps Script si está configurado
                    if (URL_SCRIPT && URL_SCRIPT !== "TU_URL_DE_APPS_SCRIPT_AQUI") {
                        try {
                            const res = await fetch(URL_SCRIPT, {
                                method: "POST",
                                body: JSON.stringify({
                                    accion: "guardarPrenda",
                                    correo: localStorage.getItem("usuario") || "invitado@armario.com",
                                    categoria: categoria,
                                    urlImagen: urlImagenLimpias
                                })
                            });
                            const data = await res.json();
                            if (data.status === "success") {
                                alert("¡Prenda guardada exitosamente en tu armario!");
                            } else {
                                alert("Prenda procesada, pero hubo un aviso al guardar.");
                            }
                        } catch (netErr) {
                            console.error("Error de red con Apps Script:", netErr);
                            alert("¡Prenda procesada con éxito (modo local)!");
                        }
                    } else {
                        alert("¡Fondo de prenda eliminado con éxito!");
                    }
                    ocultarLoader();
                }
                
                reader.readAsDataURL(blobLimpio);
            } catch (err) {
                ocultarLoader();
                console.error(err);
                alert("Error al procesar la prenda: " + err);
            }
        }
    </script>
</body>
</html>
