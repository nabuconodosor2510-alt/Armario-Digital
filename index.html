<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Armario IA - Opción Cloud API</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #fff; }
        p { color: var(--text-muted); font-size: 14px; }
        .hidden { display: none !important; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            border: 2px dashed var(--primary);
            display: block;
            padding: 15px;
            cursor: pointer;
            border-radius: 10px;
            background-color: rgba(99, 102, 241, 0.08);
            color: var(--text-color);
            font-weight: 600;
            margin: 15px 0;
            transition: background 0.3s;
        }
        .custom-file-upload:hover {
            background-color: rgba(99, 102, 241, 0.2);
        }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: var(--primary-hover); }

        #previewCuerpo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin: 15px auto;
            border: 3px solid var(--primary);
            display: block;
            background: #fff; /* Para notar la transparencia */
        }
        .loader {
            margin: 15px 0;
            color: var(--text-muted);
            font-style: italic;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container" id="seccionPerfil">
        <h2>Mi Armario IA</h2>
        <p>Sube tu foto y la nube borrará el fondo al instante</p>

        <div id="loaderContainer" class="loader hidden">
            <span id="loaderText">La IA en la nube está procesando tu foto...</span>
        </div>

        <img id="previewCuerpo" class="hidden" alt="Vista previa sin fondo">

        <label class="custom-file-upload">
            <input type="file" id="inputFotoCuerpo" accept="image/*" onchange="procesarFotoConCloudAPI(event)">
            📷 Seleccionar foto
        </label>

        <button id="btnRegistrar" class="hidden" onclick="ejecutarRegistro()">Guardar y Continuar</button>
    </div>

    <script>
        let fotocuerpoB64 = "";

        function mostrarLoader(mensaje) {
            document.getElementById('loaderText').innerText = mensaje;
            document.getElementById('loaderContainer').classList.remove('hidden');
        }

        function ocultarLoader() {
            document.getElementById('loaderContainer').classList.add('hidden');
        }

        async function procesarFotoConCloudAPI(event) {
            const file = event.target.files[0];
            if (!file) return;

            mostrarLoader("Enviando foto a la IA en la nube...");

            // ⚠️ AQUÍ IRÍA TU API KEY DE UN SERVICIO COMO REMOVE.BG (O ALTERNATIVA GRATUITA)
            // Puedes registrarte gratis en remove.bg y te dan 50 créditos/mes para pruebas.
            const API_KEY = "TU_API_KEY_DE_REMOVE_BG"; 

            if (API_KEY === "TU_API_KEY_DE_REMOVE_BG") {
                ocultarLoader();
                alert("Por favor, configura tu API Key en el código para usar el servicio en la nube.");
                return;
            }

            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto');

            try {
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': API_KEY
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Error al conectar con el servicio de IA en la nube.");
                }

                // La API responde directamente con la imagen en formato PNG transparente (Blob)
                const blob = await response.blob();
                
                const reader = new FileReader();
                reader.onloadend = function() {
                    fotocuerpoB64 = reader.result;
                    const preview = document.getElementById('previewCuerpo');
                    preview.src = fotocuerpoB64;
                    preview.classList.remove('hidden');
                    document.getElementById('btnRegistrar').classList.remove('hidden');
                    ocultarLoader();
                }
                reader.readAsDataURL(blob);

            } catch (err) {
                ocultarLoader();
                console.error(err);
                alert("Hubo un error: " + err.message);
            }
        }

        function ejecutarRegistro() {
            alert("¡Imagen con fondo transparente guardada con éxito!");
        }
    </script>
</body>
</html>
