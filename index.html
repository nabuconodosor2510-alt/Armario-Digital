<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Armario IA - Smart Frame</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #fff; }
        p { color: var(--text-muted); font-size: 14px; }
        .hidden { display: none !important; }
        input[type="file"] { display: none; }
        
        .custom-file-upload {
            border: 2px dashed var(--primary);
            display: block;
            padding: 15px;
            cursor: pointer;
            border-radius: 10px;
            background-color: rgba(99, 102, 241, 0.08);
            color: var(--text-color);
            font-weight: 600;
            margin: 15px 0;
            transition: background 0.3s;
        }
        .custom-file-upload:hover {
            background-color: rgba(99, 102, 241, 0.2);
        }
        
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background-color: var(--primary-hover); }

        /* Contenedor inteligente para la foto de perfil */
        .profile-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 15px auto;
            border: 3px solid var(--primary);
            overflow: hidden;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #previewCuerpo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Contenedor inteligente para las prendas (estilo catálogo) */
        .garment-frame {
            width: 100%;
            height: 220px;
            border-radius: 12px;
            margin: 15px 0;
            border: 2px solid var(--border-color);
            overflow: hidden;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #previewPrenda {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantiene la proporción completa de la prenda */
            padding: 10px;
            box-sizing: border-box;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: white;
            margin-bottom: 15px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- Sección 1: Foto de Perfil -->
    <div class="container" id="seccionPerfil">
        <h2>Mi Armario IA</h2>
        <p>Configura tu foto de perfil</p>

        <div class="profile-frame hidden" id="marcoPerfil">
            <img id="previewCuerpo" alt="Vista previa perfil">
        </div>

        <label class="custom-file-upload">
            <input type="file" id="inputFotoCuerpo" accept="image/*" onchange="procesarFotoPerfil(event)">
            📷 Seleccionar foto de perfil
        </label>

        <button id="btnContinuar" class="hidden" onclick="irASeccionPrendas()">Guardar y Continuar</button>
    </div>

    <!-- Sección 2: Gestión de Prendas -->
    <div class="container hidden" id="seccionPrendas">
        <h2>Gestión de Prendas</h2>
        <p>Sube y organiza la ropa de tu armario</p>

        <select id="categoriaPrenda">
            <option value="superior">Parte Superior (Polos, Camisas)</option>
            <option value="inferior">Parte Inferior (Pantalones, Shorts)</option>
            <option value="calzado">Calzado (Zapatillas, Zapatos)</option>
            <option value="accesorios">Accesorios</option>
        </select>

        <div class="garment-frame hidden" id="marcoPrenda">
            <img id="previewPrenda" alt="Vista previa prenda">
        </div>

        <label class="custom-file-upload">
            <input type="file" id="inputPrenda" accept="image/*" onchange="procesarPrenda(event)">
            👕 Seleccionar foto de prenda
        </label>

        <button id="btnGuardarPrenda" class="hidden" onclick="guardarPrendaArmario()">Añadir al Armario</button>
    </div>

    <script>
        let fotoPerfilB64 = "";
        let fotoPrendaB64 = "";

        // Procesar foto de perfil con marco circular inteligente
        function procesarFotoPerfil(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                fotoPerfilB64 = e.target.result;
                document.getElementById('previewCuerpo').src = fotoPerfilB64;
                document.getElementById('marcoPerfil').classList.remove('hidden');
                document.getElementById('btnContinuar').classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }

        // Avanzar a la sección de prendas
        function irASeccionPrendas() {
            document.getElementById('seccionPerfil').classList.add('hidden');
            document.getElementById('seccionPrendas').classList.remove('hidden');
        }

        // Procesar prenda con marco adaptativo de catálogo
        function procesarPrenda(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                fotoPrendaB64 = e.target.result;
                document.getElementById('previewPrenda').src = fotoPrendaB64;
                document.getElementById('marcoPrenda').classList.remove('hidden');
                document.getElementById('btnGuardarPrenda').classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }

        // Acción final al registrar prenda
        function guardarPrendaArmario() {
            const categoria = document.getElementById('categoriaPrenda').value;
            alert("¡Prenda guardada con éxito en la categoría: " + categoria + "!");
            // Aquí puedes conectar posteriormente tu Apps Script o base de datos local
        }
    </script>
</body>
</html>
    </script>
</body>
</html>
